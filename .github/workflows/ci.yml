name: Checks (manual)

# Testing, lint and audits only run when someone starts this workflow by hand.
# Pushes and pull requests never trigger it, and it is not a deploy gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The suite runs on in-memory SQLite (phpunit.xml); no model provider is
    # called, the assistant tests fake the HTTP endpoint.
    env:
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, sqlite3, intl, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install PHP dependencies (from lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: PHPUnit
        run: composer test

      - name: Pint
        run: php vendor/bin/pint --test

      - name: UI conventions
        run: npm run lint:ui

      - name: Node tests
        run: npm run test:ui

      - name: Composer audit
        run: composer audit

      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev
